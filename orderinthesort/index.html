<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Order in the Sort</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				padding: 20px;
				background: #0b0e11;
				margin: 0;
				padding: 0;
				color: white;
				text-align: center;
				position: absolute;
				left: 50%;
				transform: translateX(-50%);
				width: 100vw;
				overflow-x: hidden;
			}
			#container {
				display: flex;
				flex-direction: column;
				max-width: 500px;
				width: calc(100% - 8px);
				margin: auto;
			}
			.item {
				padding: 10px;
				background-color: rgba(255, 255, 255, 0.25);
				border: 1px solid #fff;
				cursor: move;
				border-radius: 8px;
				font-size: 15px;
				font-family: monospace;
				font-weight: bolder;
				margin: 2px 10px;
				text-align: left;
				transition: 0.1s;
			}
			.correct {
				background-color: rgba(0, 255, 0, 0.25);
			}
			.wrong {
				background-color: rgba(255, 0, 0, 0.25);
			}
			.selected {
				background-color: rgba(0, 255, 255, 0.25);
			}

			button {
				font-size: 30px;
				margin: 20px;
				border-radius: 8px;
				background: rgba(255, 255, 255, 0.25);
				border: 1px solid white;
				color: white;
				padding: 10px 40px;
				cursor: pointer;
				transition: 0.2s;
			}

			button:hover {
				scale: 1.1;
			}

			@media screen and (max-width: 600px) {
				h1 {
					font-size: 30px;
				}
				.item {
					font-size: 15px;
				}
			}

			@media screen and (max-width: 300px) {
				h1 {
					font-size: 20px;
				}
				.item {
					font-size: 10px;
				}
			}
		</style>
	</head>
	<body>
		<h1>Java Order Precedence</h1>
		<h3>Highest Precedence</h3>
		<div id="container"></div>
		<h3>Lowest Precedence</h3>
		<div id="buttons">
			<button onclick="checkOrder()">Submit</button>
			<button onclick="shuffle()">Shuffle</button>
		</div>

		<script>
			const container = document.getElementById("container");
			const precedence = [
				["()", "[]", "new", ".", "::"],
				["x++", "x--"],
				["-x", "+x", "!", "~", "++x", "--x"],
				["(int)"],
				["*", "/", "%"],
				["+", "-"],
				["<<", ">>", ">>>"],
				["<", "<=", ">", ">=", "instanceof"],
				["==", "!="],
				["&"],
				["^"],
				["|"],
				["&&"],
				["||"],
				["x ? y : z"],
				["=", "+=", "-=", "*=", "/=", "%=", "&=", "^=", "|=", "<<=", ">>=", ">>>="],
				["->"]
			]
			const params = new URLSearchParams(window.location.search);
			const size = Math.min(Math.max(parseInt(params.get("size")), 2), precedence.length) || precedence.length;
			
			function getOriginalItems() {
				const items = [];
				for (const op of precedence)
					items.push(op[Math.floor(Math.random() * op.length)]);
				while (items.length > size) items.splice(Math.floor(Math.random() * items.length), 1);
				return items;
			}

			let originalItems, shuffledItems;
			let draggedItem = null;

			function shuffle() {
				originalItems = getOriginalItems();
				shuffledItems = [...originalItems];
				shuffledItems.sort(() => Math.random() - 0.5);
				container.innerHTML = "";

				shuffledItems.forEach((text) => {
					container.appendChild(createDraggableItem(text));
				});
			}
			shuffle();

			function createDraggableItem(text) {
				const div = document.createElement("div");
				div.className = "item";
				div.draggable = true;
				div.textContent = text;
				div.draggable = true;
				addDragHandlers(div);
				return div;
			}

			function addDragHandlers(item) {
				function dragAndDrop() {
					const draggedIndex = [...container.children].indexOf(
						draggedItem
					);
					const targetIndex = [...container.children].indexOf(
						item
					);

					if (draggedIndex < targetIndex) {
						container.insertBefore(
							draggedItem,
							item.nextSibling
						);
					} else {
						container.insertBefore(draggedItem, item);
					}

					draggedItem.className = "item";
					draggedItem = null;
				}

				item.addEventListener("dragstart", () => draggedItem = item);
				item.addEventListener("dragover", e => e.preventDefault());
				item.addEventListener("drop", () => {
					if (draggedItem && draggedItem !== item) dragAndDrop();
				});
				item.addEventListener("click", () => {
					if (draggedItem) {
						if (draggedItem === item) {
							draggedItem.className = "item";
							draggedItem = null;
						}
						else dragAndDrop();
					} else {
						draggedItem = item;
						draggedItem.className = "item selected";
					}
				})
			}

			function checkOrder() {
				[...container.children].forEach((item, index) => {
					if (item.textContent === originalItems[index]) {
						item.className = "item correct";
					} else {
						item.className = "item wrong";
					}
				});
			}
		</script>
	</body>
</html>
